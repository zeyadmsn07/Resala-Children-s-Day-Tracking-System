name: Supabase Keepalive

on:
  schedule:
    # Every Monday and Thursday at midnight UTC
    - cron: "0 0 * * 1,4"
  workflow_dispatch: # Allow manual trigger for testing

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping Supabase to keep database alive
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Ping the public keepalive RPC as specified in UI_SPEC-2 Section 9.6.
          # This keeps the Postgres database active without requiring table access.
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 120 \
            -X POST "${SUPABASE_URL}/rest/v1/rpc/keepalive" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "Supabase responded with HTTP $response"

          if [ "$response" -eq 200 ] || [ "$response" -eq 204 ]; then
            echo "Keepalive ping successful (HTTP $response)."
          else
            echo "::warning::Keepalive RPC returned status $response (if keepalive() is not yet deployed, fallback pinging rest root)"
            exit 0
          fi
